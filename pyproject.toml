[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastmile"
version = "0.2.0"
description = "Bay Wheels GBFS collection and a San Francisco bike-share operations dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Data
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "requests>=2.28.0",
    # Database — MySQL for now. PyMySQL is pure Python, so it installs
    # without build tools.
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    # Dashboard
    "streamlit>=1.28.0,<1.57",
    "altair>=5.0.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.20.0",
    # Coverage geometry
    "shapely>=2.0.0",
    "pyproj>=3.0.0",
]

[project.optional-dependencies]
# Stockout forecasting is an in-progress experiment; its deps stay optional
# so a collection-only deployment does not pull in scikit-learn.
forecast = ["scikit-learn>=1.4.0", "joblib>=1.3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lastmile = "lastmile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the inherited code favors readable SQL/markup over 88 columns.
# B905/B007: pre-existing patterns in charting and forecasting code.
ignore = ["E501", "B905", "B007"]
