[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastmile"
version = "0.3.0"
description = "GBFS collection into a Parquet warehouse, and a bike-share operations dashboard over it"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Data
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "requests>=2.28.0",
    # Warehouse — DuckDB reads and writes the Parquet lake directly, so there
    # is no server, no driver and no connection string.
    "duckdb>=1.1",
    # DuckDB hands TIMESTAMPTZ values to Python through pytz; pandas 3 no
    # longer pulls it in.
    "pytz>=2023.3",
    # Dashboard
    "streamlit>=1.28.0,<1.57",
    "altair>=5.0.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.20.0",
    # Coverage geometry
    "shapely>=2.0.0",
    "pyproj>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lastmile = "lastmile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the inherited code favors readable SQL/markup over 88 columns.
# B905/B007: pre-existing patterns in charting and forecasting code.
ignore = ["E501", "B905", "B007"]
