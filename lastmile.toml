# LastMile configuration. Defaults for omitted keys are in src/lastmile/settings.py.

[general]
default_system = "austin"
request_timeout_s = 30
umami_website_id = "" # Umami analytics id; blank disables feature.

[systems.austin]
lake_path = "data/lake/austin"
feeds_url = "https://austin.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json"
feeds_lang = "en"
timezone = ""
dashboard_title = "Last Mile · Austin"
boundary_geojson = "assets/austin.json"
projected_crs = "EPSG:4269"

[systems.curitiba]
lake_path = "data/lake/curitiba"
feeds_url = "https://curitiba.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json"
feeds_lang = "en"
timezone = ""
dashboard_title = "Last Mile · Curitiba"
boundary_geojson = "assets/curitiba.json"
projected_crs = "EPSG:31982"

[metrics]
# Problematic station, hours of operation (inclusive)
ops_day_hour_start = 7
ops_day_hour_end = 20
# Empty or full in any of the trailing N daytime hours flags a station.
problematic_lookback_hours = 3

# Search radius for a station to rebalance from.
backup_station_radius_m = 900
# Free-floating e-bikes at or below this range are low-range.
low_range_meters = 5000
# Bike share below this, with docks free, is "low".
low_station_bike_share = 0.2
# Trailing days for the "typical for this hour" supply baseline.
supply_baseline_days = 28
# Hours (local) when the parked fleet approximates fleet size.
fleet_baseline_hours = [0, 1, 2, 3, 4]
# Walk-shed radius around each available bike.
coverage_radius_m = 300
